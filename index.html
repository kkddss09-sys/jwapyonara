<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좌표나라 — 휴대폰·부동산 무료 도구 모음</title>
<meta name="description" content="자급제와 성지 비교, 평수 계산, 평당 가격, 대출 한 달 상환액, 전월세 전환까지. 휴대폰 살 때와 집 볼 때 필요한 계산을 가입 없이 무료로.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b64da">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="_common/icon-192.png">
<link rel="apple-touch-icon" href="_common/icon-192.png">
<link rel="stylesheet" href="_common/common.css">
</head>
<body>
<main class="wrap">
  <h1>좌표나라<br>무료 도구 모음</h1>
  <p class="lead">휴대폰 살 때, 집 볼 때 필요한 계산을 가입 없이 바로. 아래에서 분야를 먼저 고르세요.</p>
  <input class="search" id="q" type="search" placeholder="바로 찾기: 자급제, 평수, 대출, 전세…" aria-label="도구 찾기">
  <div id="list"></div>
  <p class="empty" id="empty">찾는 도구가 아직 없어요. 카톡방에 말씀해 주시면 만들어 볼게요.</p>
</main>

<script src="_common/common.js"></script>
<script>
(function () {
  var T = ZW.TOOLS, CATS = ZW.CATS, list = document.getElementById('list'), q = document.getElementById('q');
  var ready = function (t) { return t[4] && t[0]; };
  var card = function (t) { return '<a class="tool' + (ready(t) ? '' : ' soon') + '" href="' + (ready(t) ? t[0] + '/index.html' : '#') + '"><b>' + t[1] + '</b><span>' + t[2] + '</span></a>'; };
  var count = function (c) { return T.filter(function (t) { return ready(t) && t[3] === c; }).length; };

  // 찾기: 그냥 글자로 찾고, 초성만 넣었으면("ㄷㅊ") 초성끼리 견준다. 띄어쓰기와 영문 대소문자는 무시한다
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function cho(s) { return s.replace(/[가-힣]/g, function (ch) { return CHO.charAt(Math.floor((ch.charCodeAt(0) - 0xAC00) / 588)); }); }
  function hit(text, word) {
    var t = text.toLowerCase().replace(/s+/g, ''), w = word.toLowerCase().replace(/s+/g, '');
    if (!w) return true;
    if (t.indexOf(w) >= 0) return true;
    return /^[ㄱ-ㅎ]+$/.test(w) && cho(t).indexOf(w) >= 0;
  }

  // 분야 카드: 휴대폰·부동산은 크게, 나머지는 작게
  function catCard(c, big) {
    return '<a class="catcard' + (big ? ' big' : '') + '" href="' + ZW.CAT_PATH[c] + '/index.html"><b>' + c + '</b><span>' + ZW.CAT_DESC[c] + '</span><small>쓸 수 있는 도구 ' + count(c) + '개 ›</small></a>';
  }

  function draw() {
    var word = q.value.trim(), html = '', shown = 0;
    if (!word) {
      html += '<div class="catgrid">' + catCard('휴대폰', true) + catCard('부동산', true) + '</div>';
      html += '<div class="catgrid small">' + CATS.slice(2).map(function (c) { return catCard(c, false); }).join('') + '</div>';
      // 이 기기에서 자주 연 도구를 맨 위에
      var uses = ZW.uses(), used = function (t) { return uses[t[0]] || 0; };
      var mineTop = T.filter(function (t) { return ready(t) && used(t) > 0; }).sort(function (a, b) { return used(b) - used(a); }).slice(0, 4);
      if (mineTop.length) html += '<section class="cat"><h2>자주 쓴 도구 <small>이 기기에서 많이 연 순서</small></h2><div class="tools" style="margin-top:10px">' + mineTop.map(card).join('') + '</div></section>';
      shown = 1;
    } else {
      // 찾는 중에는 분야 상관없이 맞는 도구를 분야별로 모아 보여 준다
      CATS.forEach(function (c) {
        var mine = T.filter(function (t) { return t[3] === c && hit(t[1] + ' ' + t[2] + ' ' + t[3] + ' ' + t[5], word); });
        if (!mine.length) return;
        shown += mine.length;
        mine.sort(function (a, b) { return (ready(a) ? 0 : 1) - (ready(b) ? 0 : 1); });
        html += '<section class="cat"><h2><a class="catlink" href="' + ZW.CAT_PATH[c] + '/index.html">' + c + '</a> <small>' + mine.filter(ready).length + '개</small></h2><div class="tools" style="margin-top:10px">' + mine.map(card).join('') + '</div></section>';
      });
    }
    list.innerHTML = html;
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
  }

  q.addEventListener('input', draw);
  // 예전 주소(#부동산 처럼 분류가 붙은 것)로 들어오면 그 분야의 하위 쪽으로 보낸다
  var old = decodeURIComponent(location.hash.slice(1));
  if (ZW.CAT_PATH[old]) { location.replace(ZW.CAT_PATH[old] + '/index.html'); return; }
  draw();
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) { navigator.serviceWorker.register("./sw.js").catch(function(){}); }
})();
</script>
</body>
</html>
