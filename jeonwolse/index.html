<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전월세 전환 계산기 — 전세를 월세로, 월세를 전세로 | 좌표나라</title>
<meta name="description" content="전세금을 월세로 바꾸면 얼마인지, 월세를 전세로 치면 얼마인지 전환율을 넣어 바로 계산합니다. 가입 없이 무료.">
<link rel="stylesheet" href="../_common/common.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("zw-theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
</head>
<body>
<main class="wrap">
  <h1>전세 ↔ 월세<br>바꿔 보기</h1>
  <p class="lead">숫자를 바꾸면 바로 계산됩니다. 아래 숫자는 예시이니 바꿔 넣으세요.</p>

  <section class="result" aria-live="polite">
    <div class="verdict" id="verdict"></div>
    <div class="sub" id="sub"></div>
  </section>

  <section class="card">
    <div class="field">
      <div class="seg two" role="group" aria-label="바꾸는 방향">
        <button type="button" data-t="j2w" class="on">전세를 월세로</button>
        <button type="button" data-t="w2j">월세를 전세로</button>
      </div>
    </div>
    <div class="field" id="fJeonse"><label for="jeonse">전세금 <b class="hint" id="jeonseHint"></b></label><div class="inp"><input id="jeonse" inputmode="numeric" value="500,000,000"><span>원</span></div></div>
    <div class="field"><label for="dep">월세 보증금 <b class="hint" id="depHint"></b></label><div class="inp"><input id="dep" inputmode="numeric" value="100,000,000"><span>원</span></div></div>
    <div class="field" id="fWolse" hidden><label for="wolse">한 달 월세</label><div class="inp"><input id="wolse" inputmode="numeric" value="1,000,000"><span>원</span></div></div>
    <div class="field"><label for="rate">전환율 (1년 기준)</label><div class="inp"><input id="rate" inputmode="decimal" value="5.0"><span>%</span></div></div>
  </section>

  <p class="note">※ 전환율은 지역과 계약마다 다릅니다. 법으로 정한 상한이 따로 있으니, 실제 계약에서는 그 기준을 확인하세요.</p>
  <div class="ad" id="ad1"></div>

  <details open>
    <summary>어떻게 계산했나요?</summary>
    <ul>
      <li>전세를 월세로: 한 달 월세 = (전세금 − 월세 보증금) × 전환율 ÷ 12</li>
      <li>월세를 전세로: 전세로 친 금액 = 보증금 + 한 달 월세 × 12 ÷ 전환율</li>
      <li>전환율은 넣으신 값을 그대로 씁니다. 이 화면이 정한 기준은 없습니다.</li>
    </ul>
  </details>
</main>
<script src="../_common/re-calc.js"></script>
<script src="../_common/common.js"></script>
<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var jeonse = ZW.money('jeonse', render), dep = ZW.money('dep', render), wolse = ZW.money('wolse', render), rate = ZW.number('rate', render, 30), mode = ZW.seg(render);
  function render() {
    var j2w = mode() === 'j2w';
    el('fJeonse').hidden = !j2w; el('fWolse').hidden = j2w;
    if (!rate()) { el('verdict').textContent = '전환율을 넣어 보세요'; el('sub').textContent = ''; return; }
    if (j2w) {
      var w = toWolse(jeonse(), dep(), rate());
      el('verdict').innerHTML = '보증금 ' + (ZW.read(dep()) || '0원') + '에<br>월세 <em>' + ZW.fmt(w) + '원</em>';
      el('sub').textContent = jeonse() > dep() ? '전세금에서 보증금을 뺀 ' + ZW.read(jeonse() - dep()) + '을 월세로 바꾼 값입니다.' : '보증금이 전세금보다 크거나 같아 월세가 0원입니다.';
    } else {
      var j = toJeonse(dep(), wolse(), rate());
      el('verdict').innerHTML = '전세로 치면 <em>' + (ZW.read(j) || ZW.fmt(j) + '원') + '</em>';
      el('sub').textContent = '정확히는 ' + ZW.fmt(j) + '원입니다.';
    }
  }
  render();
})();
</script>
</body>
</html>
