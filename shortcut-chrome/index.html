<!doctype html>
<html lang="ko">
<head>

<title>크롬 단축키 모음 — 닫은 탭 다시 열기, 시크릿 창, 찾기 | 좌표나라</title>
<meta name="description" content="크롬에서 자주 쓰는 단축키를 찾기 칸으로 바로. 실수로 닫은 탭 다시 열기, 시크릿 창, 페이지 안 찾기, 확대·축소. 가입 없이 무료.">
<link rel="stylesheet" href="../_common/common.css">
</head>
<body>
<main class="wrap">
  <h1>크롬 단축키</h1>
  <p class="lead">찾는 일을 적으면 바로 나옵니다. 키를 같이 누르면 됩니다.</p>
  <label class="inp sc-q"><input id="q" type="search" placeholder="예: 캡처, 복사, 재시작" autocomplete="off"></label>
  <div class="sc-chips" id="chips"></div>
  <p class="sc-cnt" id="cnt"></p>
  <div class="sc-list" id="list"></div>
  <p class="note">※ 윈도우 기준입니다. 맥에서는 Ctrl 대신 ⌘(Command)를 누르면 대부분 같습니다. 엣지 브라우저에서도 거의 같습니다. 컴퓨터 전체 단축키는 <a href="../shortcut-windows/">윈도우 단축키</a>에 있습니다.</p>
</main>
<script src="../_common/common.js"></script>
