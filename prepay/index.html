<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중도상환 계산기 — 먼저 갚으면 이자가 얼마나 줄까 | 좌표나라</title>
<meta name="description" content="대출 일부를 먼저 갚으면 한 달 상환액과 이자가 얼마나 줄어드는지 계산합니다. 가입 없이 무료.">
<link rel="stylesheet" href="../_common/common.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("zw-theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
</head>
<body>
<main class="wrap">
  <h1>먼저 갚으면<br>이자가 얼마나 줄까?</h1>
  <p class="lead">남은 대출 조건과 먼저 갚을 돈을 넣어 보세요. 아래 숫자는 예시입니다.</p>

  <div id="app"></div>

  <p class="note">※ 남은 기간은 그대로 두고 한 달 상환액이 줄어드는 경우로 계산합니다. 먼저 갚을 때 내는 중도상환 수수료는 넣지 않았으니 줄어드는 이자와 견줘 보세요.</p>
  <div class="ad" id="ad1"></div>

  <details open>
    <summary>어떻게 계산했나요?</summary>
    <ul>
      <li>먼저 갚기 전과 후의 원리금균등 한 달 상환액을 각각 계산합니다.</li>
      <li>줄어드는 이자 = (전의 이자 합계) − (후의 이자 합계)</li>
      <li>넣으신 값으로만 계산합니다.</li>
    </ul>
  </details>
</main>
<script src="../_common/re-calc.js"></script>
<script src="../_common/common.js"></script>
<script>
ZW.app({
  fields: [
    { id: 'bal', label: '남은 대출금', type: 'money', value: '300,000,000', unit: '원' },
    { id: 'rate', label: '연 이자율', type: 'num', value: '4.0', unit: '%', max: 30 },
    { id: 'years', label: '남은 기간', type: 'num', value: '25', unit: '년', max: 50, short: true },
    { id: 'amt', label: '먼저 갚을 돈', type: 'money', value: '30,000,000', unit: '원' }],
  compute: function (v) {
    if (!v.bal || !v.years) return {};
    var r = prepay(v.bal, v.rate, v.years, v.amt);
    return { html: '이자가 <em>' + ZW.fmt(r.interestSave) + '원</em><br>줄어듭니다', sub: '남은 기간 동안 내는 이자를 모두 더한 차이입니다.',
      rows: [['지금 한 달 상환액', ZW.fmt(r.before) + '원'], ['먼저 갚은 뒤 한 달 상환액', ZW.fmt(r.after) + '원'], ['한 달에 줄어드는 돈', ZW.fmt(r.monthSave) + '원']] };
  }
});
</script>
</body>
</html>
